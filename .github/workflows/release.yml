name: Release
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: '正式版本标签，例如 v0.1.0；已有标签将检出该标签源码'
        required: true
        type: string
permissions:
  contents: read
concurrency:
  group: release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false
jobs:
  release:
    runs-on: windows-latest
    timeout-minutes: 40
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: 校验并检出发布版本
        id: tag
        shell: pwsh
        env:
          INPUT_TAG: ${{ inputs.tag }}
          REF_TAG: ${{ github.ref_name }}
        run: |
          $tag = if ($env:INPUT_TAG) { $env:INPUT_TAG } else { $env:REF_TAG }
          if ($tag -cnotmatch '^v[0-9][0-9A-Za-z._-]*$') { throw '版本标签必须以 v 和数字开头，且仅包含字母、数字、点、下划线和连字符。' }
          git rev-parse --verify --quiet "refs/tags/$tag" *> $null
          if ($LASTEXITCODE -eq 0) {
            git checkout --detach "refs/tags/$tag"
            if ($LASTEXITCODE -ne 0) { throw '无法检出已存在的发布标签。' }
          }
          "value=$tag" >> $env:GITHUB_OUTPUT
          exit 0
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9
        with:
          dotnet-version: '10.0.x'
      - name: 验证并打包 Windows 程序
        shell: pwsh
        run: ./scripts/Publish.ps1 -BackgroundOnly
      - name: 整理发布文件
        shell: pwsh
        env:
          RELEASE_TAG: ${{ steps.tag.outputs.value }}
        run: |
          New-Item -ItemType Directory -Force release | Out-Null
          Copy-Item artifacts/pinyin-gloss-win-x64.zip "release/pinyin-gloss-win-x64-$env:RELEASE_TAG.zip"
      - name: 发布到 GitHub Release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.tag.outputs.value }}
        run: |
          $ErrorActionPreference = 'Stop'
          $commit = (git rev-parse HEAD).Trim()
          gh release view $env:RELEASE_TAG *> $null
          if ($LASTEXITCODE -ne 0) {
            gh release create $env:RELEASE_TAG --target $commit --title "Pinyin Gloss $env:RELEASE_TAG" --generate-notes
            if ($LASTEXITCODE -ne 0) { throw '创建 Release 失败。' }
          }
          $assets = @(Get-ChildItem release -File | ForEach-Object { $_.FullName })
          if ($assets.Count -eq 0) { throw '发布文件为空。' }
          gh release upload $env:RELEASE_TAG @assets --clobber
          if ($LASTEXITCODE -ne 0) { throw '上传 Release 文件失败。' }
