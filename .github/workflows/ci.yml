name: Build and test
on:
  push:
    branches: [main, 'feat/**']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  core-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - run: dotnet test tests/PinyinGloss.Tests -c Release --logger trx --results-directory artifacts/test-results
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: core-test-results
          path: artifacts/test-results
  windows-build:
    needs: core-tests
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - run: dotnet build PinyinGloss.sln -c Release
      - run: ./scripts/Publish.ps1
        shell: pwsh
      - uses: actions/upload-artifact@v4
        with:
          name: pinyin-gloss-win-x64
          path: artifacts/pinyin-gloss-win-x64.zip
          if-no-files-found: error
